    x-runtipi:
      is_main: true
      internal_port: 8080
  notifications-engine:
    # Unmodified official ntfy (Apache-2.0), pinned by digest.
    image: binwiederhier/ntfy:v2.29.0@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    command:
    - serve
    environment:
      NTFY_LISTEN_HTTP: ':8080'
      # ntfy refuses to start with an attachment cache but no base URL; default to the box-only address.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:${APP_PORT}}
      NTFY_BEHIND_PROXY: 'true'
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 720h
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-}
      NTFY_ENABLE_LOGIN: 'false'
      NTFY_ENABLE_SIGNUP: 'false'
    volumes:
    - ${APP_DATA_DIR}/data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://127.0.0.1:8080/v1/health -O - | grep -q healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
