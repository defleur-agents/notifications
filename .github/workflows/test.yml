name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated MCP front is up to date
        run: python3 mcp/inline.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
