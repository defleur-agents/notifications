# notifications: the main service is a small MCP front (mcp/front.py + mcp/tools.py, inlined by mcp/inline.py).
# It serves the Notifications tools at /mcp (box-only: apps on this box, e.g. the agent through the Wizard hub)
# and passes every other request unchanged to notifications-engine, the unmodified ntfy server, so the ntfy web
# app and the ntfy phone apps work exactly as upstream.
services:
  notifications:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 128m
    environment:
      WIZARD_APP: notifications
      APP_VERSION: 2.29.0-wizard2
      FRONT_PORT: '8080'
      UPSTREAM_HOST: notifications-engine
      UPSTREAM_PORT: '8080'
      NOTIFY_TOPIC: ${NOTIFY_TOPIC:-wizard}
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
    - notifications-engine
    command:
    - python
    - -c
    # BEGIN MCP FRONT (generated by mcp/inline.py)
    - |
      """Wizard MCP front: serves this app's MCP tools at /mcp and passes every other request,
      byte for byte, to the app behind it (HTTP, streaming and WebSockets alike).
      Stdlib only, so it runs on a stock python image with no build step.
      Generated from the app repo's mcp/ folder; edit there, then run mcp/inline.py."""
      import asyncio
      import contextvars
      import base64
      import json
      import os
      import socket
      import struct
      import time
      import urllib.parse
      import urllib.request
      import uuid

      APP = os.environ.get("WIZARD_APP", "app")
      VERSION = os.environ.get("APP_VERSION", "0")
      PORT = int(os.environ.get("FRONT_PORT", "8080"))
      UP_HOST = os.environ.get("UPSTREAM_HOST", "")
      UP_PORT = int(os.environ.get("UPSTREAM_PORT", str(PORT)))
      MCP_PATH = "/mcp"
      MCP_TOKEN = os.environ.get("MCP_TOKEN", "")  # when set, /mcp needs Authorization: Bearer <token>
      MAX_HEAD = 65536
      MAX_BODY = 1 << 20
      TOOLS = {}
      ROUTES = {}  # path prefix -> fn(method, path, query, headers, body) -> (status, content_type, bytes); app pages and APIs
      REQUEST = contextvars.ContextVar("request", default={})  # headers of the current /mcp call


      def tool(name, description, props=None, required=()):
          def deco(fn):
              schema = {"type": "object", "properties": props or {}, "required": list(required)}
              TOOLS[name] = ({"name": name, "description": description, "inputSchema": schema}, fn)
              return fn
          return deco


      def route(prefix):
          def deco(fn):
              ROUTES[prefix] = fn
              return fn
          return deco


      async def serve_route(reader, writer, fn, method, target, rest):
          headers = {}
          for line in rest.decode("latin-1").split("\r\n"):
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          n = int(headers.get("content-length") or 0)
          if n > MAX_BODY:
              return await respond(writer, 413, {"error": "request too large"})
          body = await reader.readexactly(n) if n else b""
          path, _, query = target.partition("?")
          try:
              code, ctype, data = await asyncio.to_thread(fn, method, path, query, headers, body)
          except Exception as e:  # an app route error is a 500 for that request only
              code, ctype, data = 500, "application/json", json.dumps({"error": "%s: %s" % (type(e).__name__, e)}).encode()
          head = "HTTP/1.1 %d %s\r\nContent-Type: %s\r\nContent-Length: %d\r\nCache-Control: no-store\r\nX-Content-Type-Options: nosniff\r\nConnection: close\r\n\r\n" % (
              code, REASONS.get(code, "OK"), ctype, len(data))
          writer.write(head.encode() + data)
          try:
              await writer.drain()
          finally:
              writer.close()


      def up_addr():
          try:
              return socket.gethostbyname(UP_HOST)
          except OSError:
              return UP_HOST


      def http(method, path, body=None, headers=None, timeout=60):
          url = "http://%s:%d%s" % (up_addr(), UP_PORT, path)
          req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
          with urllib.request.urlopen(req, timeout=timeout) as r:
              return r.status, r.read()


      def err(i, code, message):
          return {"jsonrpc": "2.0", "id": i, "error": {"code": code, "message": message}}


      def rpc(msg):
          m, i, p = msg.get("method"), msg.get("id"), msg.get("params") or {}
          if m == "initialize":
              r = {"protocolVersion": p.get("protocolVersion", "2025-06-18"), "capabilities": {"tools": {}},
                   "serverInfo": {"name": APP, "version": VERSION}}
          elif m == "tools/list":
              r = {"tools": [t[0] for t in TOOLS.values()]}
          elif m == "tools/call":
              name, args = p.get("name"), p.get("arguments") or {}
              if name not in TOOLS:
                  return err(i, -32602, "unknown tool %s" % name)
              try:
                  out = TOOLS[name][1](**args)
                  if isinstance(out, dict) and "_content" in out:
                      r = {"content": out["_content"]}
                  else:
                      text = out if isinstance(out, str) else json.dumps(out, indent=2)
                      r = {"content": [{"type": "text", "text": text[:200000]}]}
              except Exception as e:  # tool errors go back to the agent, not the transport
                  r = {"content": [{"type": "text", "text": "%s: %s" % (type(e).__name__, e)}], "isError": True}
          elif m == "ping":
              r = {}
          elif i is None:
              return None  # notification
          else:
              return err(i, -32601, "unknown method %s" % m)
          return {"jsonrpc": "2.0", "id": i, "result": r}


      REASONS = {200: "OK", 202: "Accepted", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed",
                 401: "Unauthorized", 403: "Forbidden", 415: "Unsupported Media Type", 500: "Internal Server Error", 413: "Payload Too Large", 502: "Bad Gateway"}


      async def respond(writer, code, obj=None, extra=""):
          body = b"" if obj is None else json.dumps(obj).encode()
          head = "HTTP/1.1 %d %s\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n%s\r\n" % (
              code, REASONS.get(code, "OK"), len(body), extra)
          writer.write(head.encode() + body)
          try:
              await writer.drain()
          finally:
              writer.close()


      async def mcp(reader, writer, method, rest):
          headers = {}
          for line in rest.decode("latin-1").split("\r\n"):
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          if MCP_TOKEN:
              import hmac
              if not hmac.compare_digest(headers.get("authorization", "").encode(), ("Bearer " + MCP_TOKEN).encode()):
                  return await respond(writer, 401, {"error": "this MCP needs Authorization: Bearer <token>"}, 'WWW-Authenticate: Bearer\r\n')
          if method != "POST":
              return await respond(writer, 405, {"error": "use POST %s" % MCP_PATH}, "Allow: POST\r\n")
          n = int(headers.get("content-length") or 0)
          if n > MAX_BODY:
              return await respond(writer, 413, {"error": "request too large"})
          body = await reader.readexactly(n) if n else b""
          try:
              msg = json.loads(body or b"{}")
          except ValueError:
              return await respond(writer, 400, err(None, -32700, "parse error"))
          REQUEST.set(headers)
          batch = msg if isinstance(msg, list) else [msg]
          results = await asyncio.gather(*(asyncio.to_thread(rpc, x) for x in batch if isinstance(x, dict)))
          out = [x for x in results if x]
          if not out:
              return await respond(writer, 202)
          await respond(writer, 200, out if isinstance(msg, list) else out[0])


      async def pipe(r, w):
          try:
              while True:
                  data = await r.read(65536)
                  if not data:
                      break
                  w.write(data)
                  await w.drain()
          except (ConnectionError, OSError):
              pass
          finally:
              try:
                  w.close()
              except Exception:
                  pass


      async def handle(reader, writer):
          try:
              head = await reader.readuntil(b"\r\n\r\n")
          except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, ConnectionError):
              writer.close()
              return
          line, _, rest = head.partition(b"\r\n")
          parts = line.decode("latin-1").split(" ")
          path = parts[1].split("?", 1)[0] if len(parts) >= 3 else ""
          if path == MCP_PATH:
              return await mcp(reader, writer, parts[0], rest)
          for prefix, fn in ROUTES.items():
              if path == prefix.rstrip("/") or path.startswith(prefix):
                  return await serve_route(reader, writer, fn, parts[0], parts[1], rest)
          if not UP_HOST:
              return await respond(writer, 404, {"error": "not found"})
          try:
              ur, uw = await asyncio.open_connection(UP_HOST, UP_PORT)
          except OSError:
              return await respond(writer, 502, {"error": "%s is starting or not reachable" % APP})
          # One request per proxied connection (unless it is an upgrade such as a WebSocket), so a
          # later /mcp request can never ride an upstream keep-alive connection.
          lines = head.decode("latin-1").split("\r\n")
          if not any(l.lower().startswith("upgrade:") for l in lines):
              lines = [l for l in lines if l and not l.lower().startswith(("connection:", "keep-alive:"))]
              head = ("\r\n".join(lines) + "\r\nConnection: close\r\n\r\n").encode("latin-1")
          uw.write(head)
          await uw.drain()
          await asyncio.gather(pipe(reader, uw), pipe(ur, writer))


      async def main():
          srv = await asyncio.start_server(handle, "0.0.0.0", PORT, limit=MAX_HEAD)
          async with srv:
              await srv.serve_forever()


      # ---- tools for this app ----
      # Notifications tools: the agent sends the owner a notification and reads recent ones.
      # Everything goes to one topic on the box's own ntfy server (the engine behind this front), which the owner
      # subscribes to once in the ntfy phone app or the web app. Nothing leaves the box unless the owner points
      # their phone at it.

      TOPIC = os.environ.get("NOTIFY_TOPIC", "wizard")
      PRIORITIES = {"min": 1, "low": 2, "default": 3, "high": 4, "urgent": 5}


      def _box_only():
          """Only apps on this box (e.g. the agent through the Wizard hub) can use these tools, never a request that
          came in through Tailscale Serve, a tunnel or a proxy."""
          h = REQUEST.get()
          if any(h.get(k) for k in ("tailscale-user-login", "x-forwarded-for", "forwarded", "cf-connecting-ip",
                                    "cf-access-jwt-assertion", "x-real-ip")):
              raise PermissionError("the Notifications tools are only for apps on this box")


      def _clean(text, limit):
          text = " ".join(str(text or "").split()) if limit <= 250 else str(text or "").strip()
          return text[:limit]


      @tool("notify", "Send the owner a notification on their phone and in the Notifications app. Use it for things "
            "they asked to be told about, finished long jobs, or problems that need them. Keep it short and plain.",
            {"message": {"type": "string", "description": "What happened, in one or two sentences"},
             "title": {"type": "string", "description": "Short title, e.g. 'Video ready' (optional)"},
             "priority": {"type": "string", "enum": list(PRIORITIES), "description": "default unless it is urgent"},
             "link": {"type": "string", "description": "https link to open when tapped (optional)"},
             "tags": {"type": "string", "description": "Comma-separated emoji short codes, e.g. 'white_check_mark' (optional)"}},
            ["message"])
      def notify(message, title="", priority="default", link="", tags=""):
          _box_only()
          body = _clean(message, 4000)
          if not body:
              raise ValueError("say what to tell the owner")
          payload = {"topic": TOPIC, "message": body, "priority": PRIORITIES.get(str(priority or "default"), 3)}
          if title:
              payload["title"] = _clean(title, 250)
          if link:
              url = str(link).strip()
              if not url.startswith("https://") or any(c.isspace() for c in url):
                  raise ValueError("link must be an https:// address")
              payload["click"] = url[:2000]
          if tags:
              payload["tags"] = [t for t in (_clean(x, 40) for x in str(tags).split(",")) if t][:5]
          status, raw = http("POST", "/", json.dumps(payload).encode(), {"Content-Type": "application/json"}, timeout=20)
          sent = json.loads(raw or b"{}")
          return {"sent": True, "id": sent.get("id"), "topic": TOPIC, "time": sent.get("time")}


      @tool("notifications_recent", "Read the notifications sent to the owner recently, newest last.",
            {"since": {"type": "string", "description": "How far back: e.g. '30m', '12h', '2d' (default 24h)"},
             "limit": {"type": "integer", "description": "Max notifications, default 20, up to 100"}})
      def notifications_recent(since="24h", limit=20):
          _box_only()
          window = str(since or "24h").strip()
          if not window or len(window) > 6 or not window[:-1].isdigit() or window[-1] not in "smhd":
              raise ValueError("since looks like 30m, 12h or 2d")
          cap = max(1, min(int(limit or 20), 100))
          status, raw = http("GET", "/%s/json?poll=1&since=%s" % (urllib.parse.quote(TOPIC), window), timeout=20)
          items = []
          for line in raw.decode("utf-8", "replace").splitlines():
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("event") != "message":
                  continue
              items.append({"time": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(m.get("time", 0))),
                            "title": m.get("title", ""), "message": m.get("message", ""),
                            "priority": m.get("priority", 3), "link": m.get("click", "")})
          return {"topic": TOPIC, "since": window, "count": len(items), "notifications": items[-cap:]}


      # ---- Inbox: the owner's view of everything sent here, with read / flag / archive ----
      # The page and its API live on this front at /notifications/ (the Wizard shell opens it at the same path on its own
      # origin). ntfy keeps the messages (30 days); this keeps only the owner's marks, in a small JSON file.
      import threading

      INBOX = "/notifications/"
      STATE_FILE = os.environ.get("INBOX_STATE", "/data/inbox.json")
      TOPICS = [t for t in os.environ.get("INBOX_TOPICS", TOPIC).split(",") if t.strip()]
      _lock = threading.Lock()


      def _load_state():
          try:
              with open(STATE_FILE) as f:
                  d = json.load(f)
              return d if isinstance(d, dict) else {}
          except (OSError, ValueError):
              return {}


      def _save_state(d):
          tmp = STATE_FILE + ".tmp"
          with open(tmp, "w") as f:
              json.dump(d, f)
          os.replace(tmp, STATE_FILE)


      def _messages(since="all"):
          out = []
          for t in TOPICS:
              status, raw = http("GET", "/%s/json?poll=1&since=%s" % (urllib.parse.quote(t.strip()), since), timeout=20)
              for line in raw.decode("utf-8", "replace").splitlines():
                  try:
                      m = json.loads(line)
                  except ValueError:
                      continue
                  if m.get("event") == "message":
                      out.append(m)
          out.sort(key=lambda m: m.get("time", 0), reverse=True)
          return out


      def inbox_items(view="inbox", limit=200):
          st = _load_state()
          items = []
          for m in _messages():
              s = st.get(m["id"], {})
              tags = m.get("tags") or []
              it = {"id": m["id"], "time": m.get("time", 0), "title": m.get("title", ""), "message": m.get("message", ""),
                    "priority": m.get("priority", 3), "link": m.get("click", ""), "tags": tags,
                    "source": "cron" if "cron" in tags else "agent",
                    "read": bool(s.get("read")), "flag": bool(s.get("flag")), "archived": bool(s.get("archived"))}
              items.append(it)
          counts = {"unread": sum(1 for i in items if not i["read"] and not i["archived"]),
                    "needs": sum(1 for i in items if not i["read"] and not i["archived"] and i["priority"] >= 4),
                    "flagged": sum(1 for i in items if i["flag"] and not i["archived"])}
          if view == "flagged":
              items = [i for i in items if i["flag"] and not i["archived"]]
          elif view == "archive":
              items = [i for i in items if i["archived"]]
          elif view == "all":
              pass
          else:
              items = [i for i in items if not i["archived"]]
          return {"view": view, "counts": counts, "items": items[:max(1, min(int(limit or 200), 500))]}


      def inbox_mark(ids, **marks):
          ids = [str(i)[:40] for i in (ids or [])][:500]
          keep = {k: bool(v) for k, v in marks.items() if k in ("read", "flag", "archived") and v is not None}
          if not ids or not keep:
              raise ValueError("give ids and at least one of read, flag, archived")
          with _lock:
              st = _load_state()
              for i in ids:
                  cur = st.get(i, {})
                  cur.update(keep)
                  if keep.get("archived"):
                      cur["read"] = True
                  st[i] = cur
              live = {m["id"] for m in _messages()}   # forget marks for messages ntfy has expired
              st = {k: v for k, v in st.items() if k in live}
              _save_state(st)
          return {"ok": True, "changed": len(ids)}


      @tool("notifications_inbox", "Read the owner's notification inbox (agent notes and scheduled-job results) with what they "
            "have read, flagged or archived. Use it to answer 'what came in', 'what failed overnight' or 'what did I flag'.",
            {"view": {"type": "string", "enum": ["inbox", "flagged", "archive", "all"], "description": "default inbox"},
             "unread_only": {"type": "boolean", "description": "only unread items"},
             "limit": {"type": "integer", "description": "max items, default 30"}})
      def notifications_inbox(view="inbox", unread_only=False, limit=30):
          _box_only()
          d = inbox_items(view, 500)
          items = [i for i in d["items"] if not (unread_only and i["read"])][:max(1, min(int(limit or 30), 200))]
          for i in items:
              i["time"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(i["time"]))
              i["message"] = i["message"][:600]
          return {"counts": d["counts"], "items": items}


      @tool("notifications_mark", "Mark inbox items read, unread, flagged or archived for the owner, when they ask.",
            {"ids": {"type": "array", "items": {"type": "string"}, "description": "item ids from notifications_inbox"},
             "read": {"type": "boolean"}, "flag": {"type": "boolean"}, "archived": {"type": "boolean"}},
            ["ids"])
      def notifications_mark(ids, read=None, flag=None, archived=None):
          _box_only()
          return inbox_mark(ids, read=read, flag=flag, archived=archived)


      def _json(code, obj):
          return code, "application/json", json.dumps(obj).encode()


      @route(INBOX)
      def inbox_route(method, path, query, headers, body):
          sub = path[len(INBOX):] if path.startswith(INBOX) else ""
          q = urllib.parse.parse_qs(query)
          if method == "GET" and sub in ("", "index.html"):
              html = MINIMAL_HTML if (q.get("layout") or [""])[0] == "minimal" else PAGE_HTML.replace('<script defer', '<script src="layout.js"></script><script defer')
              return 200, "text/html; charset=utf-8", html.encode()
          if method == "GET" and sub in MINIMAL_ASSETS:
              mime, content = MINIMAL_ASSETS[sub]
              return 200, mime + "; charset=utf-8", content.encode()
          if method == "GET" and sub == "inbox.js":
              return 200, "text/javascript; charset=utf-8", PAGE_JS.encode()
          if method == "GET" and sub == "inbox.css":
              return 200, "text/css; charset=utf-8", PAGE_CSS.encode()
          if method == "GET" and sub == "api/items":
              return _json(200, inbox_items((q.get("view") or ["inbox"])[0], (q.get("limit") or [200])[0]))
          if method == "GET" and sub == "api/count":
              return _json(200, inbox_items("inbox", 1)["counts"])
          if method == "POST" and sub == "api/mark":
              # JSON only: a form on another site cannot send this without a CORS preflight, which is never granted.
              if not headers.get("content-type", "").startswith("application/json"):
                  return _json(415, {"error": "send application/json"})
              d = json.loads(body or b"{}")
              return _json(200, inbox_mark(d.get("ids"), read=d.get("read"), flag=d.get("flag"), archived=d.get("archived")))
          if method == "GET" and sub == "healthz":
              return _json(200, {"ok": True, "view_revision": MINIMAL_REVISION})
          return _json(404, {"error": "not found"})


      PAGE_HTML = """<!doctype html>
      <html lang="en" data-app="notifications">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <meta name="color-scheme" content="dark light">
      <title>Notifications</title>
      <script>try { if (window.parent !== window) document.documentElement.classList.add('wz-hosted'); } catch (e) { document.documentElement.classList.add('wz-hosted'); }</script>
      <link rel="stylesheet" href="inbox.css">
      <script src="/wizard-os-home/core/app-client.js" onerror="this.remove()"></script>
      <script defer src="inbox.js"></script>
      </head>
      <body>
      <div class="wz-app">
        <header class="wz-head"><h1>Notifications</h1></header>
        <nav class="nt-tabs" role="tablist">
          <button role="tab" data-view="inbox" aria-selected="true">Inbox <small id="c-inbox"></small></button>
          <button role="tab" data-view="flagged" aria-selected="false">Flagged <small id="c-flagged"></small></button>
          <button role="tab" data-view="archive" aria-selected="false">Archive</button>
          <button class="nt-allread" id="allread" type="button">Mark all read</button>
        </nav>
        <main class="wz-scroll" id="scroll"><ul class="wz-list" id="list"></ul>
          <div class="wz-empty" id="empty" hidden><div class="wz-tile">&#128276;</div><strong>Nothing here</strong><p id="empty-p">Scheduled jobs and your Wizard's notes land here.</p></div>
        </main>
        <p class="wz-status" id="status" role="status" aria-live="polite"></p>
      </div>
      </body>
      </html>
      """

      PAGE_CSS = """
      :root { --ink: var(--wz-text, #f3efff); --ink-2: var(--wz-text-secondary, #b9b0d8); --ink-3: var(--wz-text-muted, #a59abf);
        --line-2: var(--wz-border, rgba(205,190,255,.24)); --line: color-mix(in srgb, var(--line-2) 55%, transparent);
        --fill: color-mix(in srgb, var(--ink) 6%, transparent); --fill-2: color-mix(in srgb, var(--ink) 10%, transparent);
        --accent: var(--wz-accent, #b99bff); --on-accent: var(--wz-on-accent, #160b32); --canvas: var(--wz-canvas, #05030c);
        --danger: #ff8f8f; --amber: #ffbe55; --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: dark; }
      html[data-color-scheme="light"] { color-scheme: light; --danger: #b42318; --amber: #a15c00; }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { font: 15px/1.4 var(--font); color: var(--ink); background: transparent; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
      html:not(.wz-hosted) body { background: var(--canvas); }
      button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .wz-app { display: flex; flex-direction: column; height: 100%; max-width: 680px; margin: 0 auto; }
      .wz-head { flex: none; padding: 18px 18px 4px; }
      .wz-head h1 { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
