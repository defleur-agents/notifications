t); }\n#toolbar { flex: none; position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 18px max(44px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }\n#filters { display: flex; border-radius: 99px; background: var(--fill); padding: 3px; }\n#filters button { min-width: 90px; padding: 0 18px; border-radius: 99px; color: var(--ink-2); }\n#filters button[aria-pressed="true"] { background: var(--fill-2); color: var(--ink); font-weight: 650; }\n#more { color: var(--ink-2); padding: 0 10px; }\n#options { position: absolute; right: 18px; bottom: calc(100% + 4px); min-width: 170px; padding: 8px; border: 1px solid var(--line-2); border-radius: 16px; background: var(--wz-surface-raised, var(--canvas)); box-shadow: 0 10px 36px var(--line); z-index: 3; }\n#options button { display: block; width: 100%; padding: 0 12px; text-align: left; border-radius: 8px; }\n#options button:hover { background: var(--fill); }\n#back { color: var(--ink-2); padding: 0 4px; }\n#subject { font-size: 22px; line-height: 1.3; margin: 16px 0 8px; overflow-wrap: anywhere; }\n#meta, #reply-note { font-size: 13px; color: var(--ink-2); }\n#body { margin: 24px 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }\n.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 10px; }\n.actions button, .actions a { border-radius: 99px; padding: 10px 16px; background: var(--fill); text-decoration: none; display: inline-flex; align-items: center; color: var(--ink); }\n.actions button:disabled { color: var(--ink-3); }\n#reply-note { max-width: 52ch; line-height: 1.5; }\n.wz-status { color: var(--ink-2); padding: 0 18px; }\n.wz-status:empty { padding: 0; margin: 0; }\n@media (min-width: 768px) { #toolbar { order: -1; justify-content: flex-start; border-top: 0; border-bottom: 1px solid var(--line); } #options { top: calc(100% + 4px); bottom: auto; left: 18px; right: auto; } .wz-head { order: -2; } }\n'), 'minimal-kit.css': ('text/css', '/* Wizard UI kit for generated apps (builder template, MVP).\n *\n * Rule 1: a hosted app paints NO canvas. In a window or fullscreen the shell\'s window glass is the\n *         canvas, exactly as it is for Chats. Only a standalone tab paints the skin\'s background.\n * Rule 2: speak Chats\' visual language: system UI type at the shell\'s sizes, ink / ink-2 / ink-3\n *         hierarchy, hairline separators, faint tinted fills instead of opaque cards, pill inputs,\n *         a round accent action. Every value derives from the appearance v1 roles (--wz-*), so all\n *         the five accepted skins and future shell-approved skins flow through without per-app colour work.\n * Rule 3: layout and content stay the app\'s own. Use these classes; add app styles in styles.css.\n *\n * Values mirror web/core/chats.css and core/base.css in Wizard UX (ch-row, ch-sec-h, ch-compose). */\n\n:root {\n  --ink: var(--wz-text, #f3efff);\n  --ink-2: var(--wz-text-secondary, #b9b0d8);\n  --ink-3: var(--wz-text-muted, #a59abf);\n  --line-2: var(--wz-border, rgba(205, 190, 255, .24));\n  --line: color-mix(in srgb, var(--line-2) 55%, transparent);\n  --fill: color-mix(in srgb, var(--ink) 6%, transparent);\n  --fill-2: color-mix(in srgb, var(--ink) 10%, transparent);\n  --accent: var(--wz-accent, #b99bff);\n  --on-accent: var(--wz-on-accent, #160b32);\n  --accent-soft: var(--wz-accent-soft, rgba(143, 99, 255, .16));\n  --canvas: var(--wz-canvas, #05030c);\n  --danger: #ff8f8f;\n  --r: 14px;          /* rows, panels */\n  --r-tile: 12px;     /* 36px tiles, search */\n  --r-pill: 20px;     /* composer input */\n  --ease: cubic-bezier(.2, .9, .25, 1);\n  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;\n  color-scheme: dark;\n}\nhtml[data-color-scheme="light"] { color-scheme: light; --danger: #b42318; }\n/* Skin shape. The protocol carries colour only today; these two skins also change shape in the shell. */\nhtml[data-skin="signal"] { --r: 2px; --r-tile: 2px; --r-pill: 2px; }\nhtml[data-skin="signal"] .wz-sec-h { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; }\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { height: 100%; margin: 0; }\nhtml { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }\nbody { font: 15px/1.4 var(--font); color: var(--ink); background: transparent; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }\nhtml[data-presentation="standalone"]:not(.wz-hosted) body { background: var(--canvas); }\nbutton, input, textarea, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; border: 0; background: none; padding: 0; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n.wz-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }\n\n/* ---------- frame: head / scroll / composer, like a Chats thread ---------- */\n.wz-app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto; }\n.wz-head { flex: none; display: flex; align-items: flex-end; gap: 12px; padding: calc(var(--wos-cutout, 0px) + 18px) 18px 6px; }\n.wz-head h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 750; letter-spacing: -.02em; }\n.wz-head p { margin: 0 0 3px auto; font-size: 13px; color: var(--ink-3); }\n/* In a window the shell\'s title bar already names the app. */\nhtml[data-presentation="window"] .wz-head { display: none; }\n.wz-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 12px; scrollbar-width: none; }\n.wz-scroll::-webkit-scrollbar { display: none; }\n\n/* ---------- section label: .ch-sec-h ---------- */\n.wz-sec + .wz-sec { border-top: 1px solid var(--line); }\n.wz-sec-h { display: flex; align-items: center; gap: 10px; margin: 0; padding: 12px 8px 8px; font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }\n.wz-sec-h small { font-size: 11.5px; font-weight: 800; letter-spacing: .05em; color: var(--ink-3); }\n.wz-count { margin-left: auto; padding: 1px 8px; border-radius: 99px; font-size: 10.5px; letter-spacing: .04em; color: var(--ink-2); background: var(--fill); }\n.wz-count.all { color: var(--on-accent); background: var(--accent); }\n\n/* ---------- rows: .ch-row ---------- */\n.wz-list { list-style: none; margin: 0; padding: 0; }\n.wz-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px; border-radius: var(--r); text-align: left; transition: background 140ms; }\n.wz-row:active { background: var(--fill); }\n@media (hover: hover) { .wz-row:hover { background: var(--fill); } }\n.wz-row .wz-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n.wz-row .wz-main b { font-size: 15px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }\n.wz-row .wz-main small { font-size: 13px; color: var(--ink-3); }\n.wz-tile { flex: none; width: 36px; height: 36px; border-radius: var(--r-tile); display: grid; place-items: center; font-size: 18px; background: var(--fill); }\n\n/* round check, 26px inside a 36px tile-sized slot (the whole row is the 44px+ target) */\n.wz-check { flex: none; width: 36px; height: 36px; display: grid; place-items: center; }\n.wz-check i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; transition: background 160ms var(--ease), border-color 160ms, transform 220ms var(--ease); }\n.wz-check svg { width: 14px; height: 14px; fill: none; stroke: var(--on-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 120ms; }\nhtml[data-skin="signal"] .wz-check i { border-radius: 2px; }\n[aria-pressed="true"] .wz-check i { background: var(--accent); border-color: var(--accent); transform: scale(1.04); }\n[aria-pressed="true"] .wz-check svg { opacity: 1; }\n[aria-pressed="true"] .wz-main b { color: var(--ink-2); }\n.wz-row:disabled { opacity: .6; cursor: progress; }\n\n/* ---------- empty state ---------- */\n.wz-empty { padding: 44px 24px 24px; text-align: center; color: var(--ink-3); }\n.wz-empty .wz-tile { margin: 0 auto 14px; width: 52px; height: 52px; border-radius: 18px; font-size: 24px; color: var(--accent); }\n.wz-empty strong { display: block; margin-bottom: 4px; font-size: 16px; font-weight: 700; color: var(--ink); }\n.wz-empty p { margin: 0 auto; max-width: 30ch; font-size: 14px; line-height: 1.4; }\n\n/* ---------- composer: .ch-compose ---------- */\n.wz-compose { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }\n.wz-input { flex: 1; min-width: 0; height: 42px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--line-2); outline: 0; background: var(--fill); color: var(--ink); font-size: 15px; }\n.wz-input::placeholder { color: var(--ink-3); }\n.wz-input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }\n.wz-send { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); transition: opacity 140ms, transform 140ms; }\nhtml[data-skin="signal"] .wz-send { border-radius: 2px; }\n.wz-send svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }\n.wz-send:disabled { opacity: .4; cursor: default; }\n.wz-send:not(:disabled):active { transform: scale(.94); }\n\n/* ---------- status: errors are visible, confirmations are for screen readers ---------- */\n.wz-status { flex: none; margin: 0; padding: 0 18px 6px; min-height: 0; font-size: 13px; color: var(--danger); }\n.wz-status:empty { padding: 0; }\n.wz-status.note { color: var(--ink-2); text-align: center; }\n\n/* Staging hosts label the page once; a hosted app never repeats that badge. */\nhtml.wz-hosted #wiz-staging-tag { display: none !important; }\n\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }\n'), 'minimal-boot.js': ('text/javascript', "/* Runs before first paint: a hosted app never flashes a standalone canvas while the shell's\n * appearance message is on its way. */\ntry { if (window.parent !== window) document.documentElement.classList.add('wz-hosted'); }\ncatch (e) { document.documentElement.classList.add('wz-hosted'); }\n"), 'layout.js': ('text/javascript', "(() => {\n const ours = new Set(['obsidian','obsidian-light','landscapes']);\n const minimal = new URL(location.href).searchParams.get('layout') === 'minimal';\n window.WizardApp?.theme.onChange(theme => {\n   const skin = theme?.skin?.id || theme?.skin || document.documentElement.dataset.skin;\n   if (!skin) return;\n   const wanted = ours.has(skin);\n   if (wanted !== minimal) { const url = new URL(location.href); if (wanted) url.searchParams.set('layout','minimal'); else url.searchParams.delete('layout'); location.replace(url.href); }\n });\n})();")}


